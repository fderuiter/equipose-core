server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 ipv6=off;

    location = /health {
        return 200 "ok\n";
    }

    location /app1/ {
        set $app1_upstream http://app1:80;
        proxy_pass $app1_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /app2/ {
        set $app2_upstream http://app2:80;
        proxy_pass $app2_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /app3/ {
        set $app3_upstream http://app3:80;
        proxy_pass $app3_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
