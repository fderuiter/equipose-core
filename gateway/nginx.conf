server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 ipv6=off;

    location = /health {
        return 200 "ok\n";
    }

    location = /auth-validate {
        internal;
        set $auth_upstream http://auth-service:3000;
        proxy_pass $auth_upstream/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location /logout {
        set $auth_upstream http://auth-service:3000;
        proxy_pass $auth_upstream/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /app1/ {
        # Strip spoofed remote-user headers on non-authenticated/public paths
        proxy_set_header X-Remote-User "";
        proxy_set_header Remote-User "";
        proxy_set_header HTTP_X_REMOTE_USER "";

        set $app1_upstream http://app1:80;
        proxy_pass $app1_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /app2/ {
        # Strip spoofed remote-user headers on non-authenticated/public paths
        proxy_set_header X-Remote-User "";
        proxy_set_header Remote-User "";
        proxy_set_header HTTP_X_REMOTE_USER "";

        set $app2_upstream http://app2:80;
        proxy_pass $app2_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /app3/ {
        # Strip spoofed remote-user headers
        proxy_set_header X-Remote-User "";
        proxy_set_header Remote-User "";
        proxy_set_header HTTP_X_REMOTE_USER "";

        # Trigger authentication subrequest
        auth_request /auth-validate;

        # Get X-Remote-User header from auth-service
        auth_request_set $user $upstream_http_x_remote_user;

        set $app3_upstream http://app3:80;
        proxy_pass $app3_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Inject the securely validated user header
        proxy_set_header X-Remote-User $user;
    }

    # Serve shared-ui files
    location /shared-ui/ {
        alias /usr/share/nginx/html/shared-ui/;
    }

    # API documentation portal
    location /docs {
        rewrite ^/docs$ /docs/ permanent;
    }

    location /docs/ {
        alias /usr/share/nginx/html/docs/;
        index index.html;
    }

    # Live OpenAPI schema endpoints for running services
    location = /app1/openapi.json {
        default_type application/json;
        alias /usr/share/nginx/html/specs/app1.json;
    }

    location = /app2/openapi.json {
        default_type application/json;
        alias /usr/share/nginx/html/specs/app2.json;
    }

    location = /app3/openapi.json {
        default_type application/json;
        alias /usr/share/nginx/html/specs/app3.json;
    }
}

