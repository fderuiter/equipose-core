server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 ipv6=off;

    # Shared HTTP header directives defined exactly once in the parent server context
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Centralized spoofed remote-user header stripping
    set $my_x_remote_user "";
    proxy_set_header X-Remote-User $my_x_remote_user;
    proxy_set_header Remote-User "";
    proxy_set_header HTTP_X_REMOTE_USER "";

    location = /health {
        return 200 "ok\n";
    }

    location = /auth-validate {
        internal;
        set $auth_upstream http://auth-service:3000;
        proxy_pass $auth_upstream/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location /logout {
        set $auth_upstream http://auth-service:3000;
        proxy_pass $auth_upstream/logout;
    }

    location /app1/ {
        set $app1_upstream http://app1:80;
        proxy_pass $app1_upstream/;
    }

    location /app2/ {
        set $app2_upstream http://app2:80;
        proxy_pass $app2_upstream/;
    }

    location /app3/ {
        # Trigger authentication subrequest
        auth_request /auth-validate;

        # Get X-Remote-User header from auth-service and dynamically populate the shared variable
        auth_request_set $my_x_remote_user $upstream_http_x_remote_user;

        set $app3_upstream http://app3:80;
        proxy_pass $app3_upstream/;
    }
}

