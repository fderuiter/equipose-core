services:
  gateway:
    image: nginx:1.27
    depends_on:
      app1:
        condition: service_started
      app2:
        condition: service_started
      app3:
        condition: service_started
      auth-service:
        condition: service_started
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/generate-config.sh:/docker-entrypoint.d/99-generate-config.sh:ro
      - ./shared-ui:/usr/share/nginx/html/shared-ui:ro
    networks:
      - equipose

  app1:
    image: python:3.12-slim
    environment:
      APP_NAME: ${APP1_NAME:-app1}
      APP_PORT: ${APP1_PORT:-80}
      DATABASE_URL: postgresql://${DB1_USER:-app1}:${DB1_PASSWORD:-app1}@db1:5432/${DB1_NAME:-app1}
    depends_on:
      db1:
        condition: service_healthy
    volumes:
      - ./gateway/server.py:/server.py
    command: python /server.py
    networks:
      - equipose

  db1:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB1_NAME:-app1}
      POSTGRES_USER: ${DB1_USER:-app1}
      POSTGRES_PASSWORD: ${DB1_PASSWORD:-app1}
      APP_ENV: ${APP_ENV:-dev}
      NODE_ENV: ${NODE_ENV:-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB1_USER:-app1} -d ${DB1_NAME:-app1}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db1-data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/init-postgres.sql:ro
      - ./scripts/seed-postgres.sh:/docker-entrypoint-initdb.d/seed-postgres.sh:ro
    networks:
      - equipose

  app2:
    image: python:3.12-slim
    environment:
      APP_NAME: ${APP2_NAME:-app2}
      APP_PORT: ${APP2_PORT:-80}
      DATABASE_URL: postgresql://${DB2_USER:-app2}:${DB2_PASSWORD:-app2}@db2:5432/${DB2_NAME:-app2}
    depends_on:
      db2:
        condition: service_healthy
    volumes:
      - ./gateway/server.py:/server.py
    command: python /server.py
    networks:
      - equipose

  db2:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB2_NAME:-app2}
      POSTGRES_USER: ${DB2_USER:-app2}
      POSTGRES_PASSWORD: ${DB2_PASSWORD:-app2}
      APP_ENV: ${APP_ENV:-dev}
      NODE_ENV: ${NODE_ENV:-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB2_USER:-app2} -d ${DB2_NAME:-app2}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db2-data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/init-postgres.sql:ro
      - ./scripts/seed-postgres.sh:/docker-entrypoint-initdb.d/seed-postgres.sh:ro
    networks:
      - equipose

  app3:
    image: python:3.12-slim
    environment:
      APP_NAME: ${APP3_NAME:-app3}
      APP_PORT: ${APP3_PORT:-80}
      DATABASE_URL: postgresql://${DB3_USER:-app3}:${DB3_PASSWORD:-app3}@db3:5432/${DB3_NAME:-app3}
    depends_on:
      db3:
        condition: service_healthy
    volumes:
      - ./gateway/server.py:/server.py
    command: python /server.py
    networks:
      - equipose

  db3:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB3_NAME:-app3}
      POSTGRES_USER: ${DB3_USER:-app3}
      POSTGRES_PASSWORD: ${DB3_PASSWORD:-app3}
      APP_ENV: ${APP_ENV:-dev}
      NODE_ENV: ${NODE_ENV:-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB3_USER:-app3} -d ${DB3_NAME:-app3}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db3-data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/init-postgres.sql:ro
      - ./scripts/seed-postgres.sh:/docker-entrypoint-initdb.d/seed-postgres.sh:ro
    networks:
      - equipose

  auth-service:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./gateway/auth-service:/app
      - ./gateway/pubkey.pem:/etc/gateway/pubkey.pem:ro
    command: node index.js
    networks:
      - equipose

  neo4j:
    build:
      context: .
      dockerfile: ./docker/neo4j.Dockerfile
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - NODE_ENV=${NODE_ENV:-dev}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/opt/neo4j/data
    networks:
      - equipose

  neo4j-seed:
    build:
      context: .
      dockerfile: ./docker/neo4j.Dockerfile
    profiles:
      - dev
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./scripts/init-neo4j.cypher:/init-neo4j.cypher:ro
      - ./scripts/seed-neo4j.sh:/seed-neo4j.sh:ro
    entrypoint: ["/bin/bash", "/seed-neo4j.sh"]
    networks:
      - equipose

networks:
  equipose:

volumes:
  db1-data:
  db2-data:
  db3-data:
  neo4j-data:
